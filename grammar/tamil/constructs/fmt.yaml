status: codegen
subset: Tamil-0.77
go_analogue: fmt
syntax: |
  # no new syntax — stdlib package வடிவம் (கொணர் "வடிவம்")
semantics: |
  Fmt-style formatting via வடிவம். வடிவமை(format, ...சரம்) for %s when the
  format is not a constant. With a constant format string (Tamil-0.77), verbs
  %s %d %t %g %v are accepted and non-string args are stringified at the call
  site (no any/interfaces). Helpers எண்உரை / மிதவைஉரை / நிலைஉரை remain.
  இணை joins strings. Missing args → %!s(MISSING).
examples:
  - |
      கொணர் "வடிவம்"
      பதிப்பி(வடிவம்.வடிவமை("எண்=%d", 42))
notes:
  - "No new keywords; வடிவம் is a compiler stdlib package."
  - "Tamil-0.77: typed verbs on constant formats."
