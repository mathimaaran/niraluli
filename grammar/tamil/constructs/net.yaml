id: net
status: codegen
subset: Tamil-0.61
go_inspired: |
  ln, _ := net.Listen("tcp", ":0")
  c, _ := net.Dial("tcp", ln.Addr().String())
  c.Write([]byte("hi"))
  n, _ := c.Read(buf)
  c.Close()
  ln.Close()
tamil_keywords: {}
tamil_ebnf: |
  # no new syntax — stdlib package வலை (கொணர் "வலை")
semantics: >
  Tamil-0.55 TCP sockets via stdlib package வலை. Tamil-0.61 adds IPv4 UDP
  datagrams: தகவல்கேள், தகவலனுப்பு, தகவல்பெறு, தகவல்முகவரி, and தகவல்விடு.
  கொணர் "வலை" resolves to the compiler stdlib (not a relative directory).
  Types கேட்பி (listener) and இணைப்பு (conn) are defined முழுஎண் (fds).
  பிழை is a struct with குறியீடு and செய்தி; every operational failure returns
  *பிழை and success returns இன்மை. கேள்/ஏற்று/இணை return (fd, *பிழை);
  படி/எழுது return (count, *பிழை); விடு/நிறுத்து return *பிழை; and முகவரி
  returns (address, *பிழை). படி returns (0, இன்மை) on EOF.
  கேள்(addr) listens (":port" or "host:port"); ஏற்று accepts; இணை dials;
  படி/எழுது use []இருமி8; விடு closes a conn;
  நிறுத்து closes a listener; முகவரி returns "host:port" (0.0.0.0 → 127.0.0.1).
  Blocking I/O parks so GC can run. No new keywords. TLS remains later;
  HTTP is Tamil-0.54 (`பரிமாற்றம்`). UDP preserves one datagram per
  receive; oversized datagrams are truncated to the supplied buffer.
examples:
  - tamil: |
      கொணர் "வலை"
      க, ப := வலை.கேள்(":0")
      எனில் ப != இன்மை { திருப்பு }
      முக, ப := வலை.முகவரி(க)
      இ, ப := வலை.இணை(முக)
    go_equivalent: |
      import "net"
      ln, _ := net.Listen("tcp", ":0")
      c, _ := net.Dial("tcp", ln.Addr().String())
notes:
  - "Tamil-0.55: package வலை; TCP IPv4; *பிழை operational errors."
  - "Tamil-0.61: IPv4 UDP datagrams via தகவல்கேள்/தகவலனுப்பு/தகவல்பெறு."
  - "Corpus தகவல்_வலை checks listen errors; TestUDPProgram skips when SOCK_DGRAM is denied."
  - "விடு = close conn; நிறுத்து = stop listener (மூடு is the chan keyword)."
  - "கேள் = listen; ஏற்று = accept; இணை = dial/connect; படி/எழுது = read/write."
  - "Stdlib path: stdlib/வலை/; dummy .uli signatures, C intrinsics in emitc."
