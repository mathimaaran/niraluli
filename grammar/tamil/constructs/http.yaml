id: http
status: codegen
subset: Tamil-0.80
go_inspired: |
  resp, err := http.Post("http://127.0.0.1:8080/echo", "text/plain", body)
  w.Header().Set("X-Echo", "ok")
  w.Write([]byte("hi"))
tamil_keywords: {}
tamil_ebnf: |
  # no new syntax — stdlib package பரிமாற்றம் (கொணர் "பரிமாற்றம்")
semantics: >
  Tamil-0.57 extends பரிமாற்றம் with a synchronous HTTP/1.0 client and
  custom response-header writes. Tamil-0.58 implements the exact-path mux
  as an Niraluli struct holding path and handler slices. Tamil-0.59 exposes
  decoded query parameters as கோரிக்கை.வினாக்கள்; repeated keys are
  last-wins, + means space, and percent escapes are decoded.
  Tamil-0.61 adds கோருவிருப்பம் with a per-operation socket timeout and
  an opt-in maximum redirect count.
  Tamil-0.80 widens நேரமுடிவு to cover dial/connect (non-blocking connect +
  poll) as well as send/receive; DNS resolve still parks but is not separately
  capped. Redirect Location may be absolute http:// or relative (/path or
  path-relative) against the current request URL.
  பதில் has குறியீடு, விளக்கம் (status text; நிலை is the bool keyword),
  தலைப்புகள், and உடல். Client APIs: பெறு(url), பதிவிடு(url, contentType,
  body), and கோரு(method, url, headers, body) return (பதில், *வலை.பிழை).
  Only http:// host[:port]/path][?query] is supported (default port 80,
  fragment stripped, IPv4 via வலை). HTTP/1.1 chunked responses are decoded.
  HTTPS, TLS, and pooling are out of scope. Redirects are disabled unless
  அதிகதிருப்புகள் is positive; supported redirects are 301, 302, 303, 307,
  and 308. நேரமுடிவு is milliseconds; zero disables dial and I/O timeouts.
  Response writers
  எழுதுதலைப்புகள் / எழுதுசரந்தலைப்புகள் take an optional header map while
  உள்ளடக்கம் remains authoritative Content-Type. User headers may not set
  Host, Content-Length, Connection, Transfer-Encoding, or Content-Type;
  CR/LF/NUL in names/values return *வலை.பிழை. Header maps are last-wins;
  response request maps lowercase names on read. Header/body limits match
  the server (64 KiB / 1 MiB).
examples:
  - tamil: |
      கொணர் "பரிமாற்றம்"
      தலை := அகராதி[சரம்]சரம்{"X-Niraluli": "வணக்கம்"}
      பதில், பிழை := பரிமாற்றம்.கோரு("POST", "http://127.0.0.1:8080/echo", தலை, []இருமி8("hi"))
      எனில் பிழை == இன்மை {
          பதிப்பி(பதில்.குறியீடு)
          பதிப்பி(பதில்.தலைப்புகள்["x-echo"])
      }
    go_equivalent: |
      req, _ := http.NewRequest("POST", "http://127.0.0.1:8080/echo", bytes.NewReader([]byte("hi")))
      req.Header.Set("X-Niraluli", "வணக்கம்")
      resp, _ := http.DefaultClient.Do(req)
notes:
  - "Locked 2026-08-13: package பரிமாற்றம் (transfer / exchange)."
  - "கையாளு is a function value, not an interface."
  - "முறைமை = HTTP method (முறை is already struct methods)."
  - "Depends on வலை (Tamil-0.53); blocking I/O parks for GC."
  - "Tamil-0.55: uses *வலை.பிழை for operational failures."
  - "Tamil-0.56: lowercase request headers + exact-path வழிப்படுத்தி."
  - "Tamil-0.57: client பெறு/பதிவிடு/கோரு + எழுதுதலைப்புகள்; status text field is விளக்கம்."
  - "Tamil-0.58: pass *வழிப்படுத்தி to பதிவு / வழிசேவைஒன்று / வழிசேவை."
  - "Tamil-0.59: கோரிக்கை.வினாக்கள் query map, strict HTTP/1.0–1.1 parsing, and chunked client responses."
  - "Tamil-0.61: கோருவிருப்பம் timeout + bounded absolute HTTP redirects."
  - "Tamil-0.80: dial/connect timeout + relative redirect Location resolution."
