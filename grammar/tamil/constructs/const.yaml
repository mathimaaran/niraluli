status: codegen
subset: Tamil-0.68
go_analogue: const / iota
syntax: |
  ConstDecl      = "மாறிலி" IdentifierList [ Type ] "=" ExpressionList .
  ConstGroupDecl = "மாறிலி" "(" ConstSpec { ";" ConstSpec } ")" .
  ConstSpec      = IdentifierList [ Type ] [ "=" ExpressionList ] .
  # Package-level and block-level. Optional வெளி for package export.
  # iota is the predeclared ASCII identifier iota (Go-style).
semantics: |
  Tamil-0.67+ compile-time constants with Tamil-0.68 parenthesized groups and
  iota. Within a group, iota is 0 for the first ConstSpec and increments by 1
  for each subsequent spec. Omitted RHS repeats the previous spec's expressions
  (re-evaluated with the new iota). Omitted type repeats the previous type.
  RHS must be a constant expression (literals, consts, iota, unary +/-/!,
  arithmetic, string +, comparisons). Allowed types: scalar types only.
  Values are folded and inlined by the C emitter.
examples:
  - |
      மாறிலி (
          பூஜ்ஜியம் = iota
          ஒன்று
          இரண்டு = iota + 2
      )
      செயல்பாடு தொடக்கம்() {
          மாறிலி (
              அ = iota * 10
              ஆ
          )
          பதிப்பி(பூஜ்ஜியம்)
      }
notes:
  - "Keyword மாறிலி is distinct from நிலை (bool type)."
  - "Bit-shift iota patterns (1 << iota) wait on shift operators."
