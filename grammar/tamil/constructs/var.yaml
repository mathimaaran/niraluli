status: codegen
subset: Tamil-0.70
go_analogue: var
syntax: |
  VarDecl = "மாறி" IdentifierList Type [ "=" ExpressionList ] .
  # Package-level and block-level. Optional வெளி for package export.
semantics: |
  Declares variables with an explicit type. Tamil-0.70 adds package-level
  மாறி (top-level variables were previously rejected). Package vars are
  zero-initialized; explicit initializers run in a per-package __init_vars
  hook before entry. Same-package read/assign uses the bare name; other
  packages use pkg.Name with வெளி. Block-level மாறி unchanged.
examples:
  - |
      வெளி மாறி பதிப்பு முழுஎண் = 1
      மாறி எண் முழுஎண்
      செயல்பாடு தொடக்கம்() {
          எண் = 42
          பதிப்பி(எண்)
      }
notes:
  - "Short declare := remains local only."
  - "No parenthesized var ( … ) groups yet."
