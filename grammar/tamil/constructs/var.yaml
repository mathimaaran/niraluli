status: codegen
subset: Tamil-0.73
go_analogue: var
syntax: |
  VarDecl      = "மாறி" ( VarSpec | "(" { VarSpec ";" } ")" ) .
  VarSpec      = IdentifierList ( Type [ "=" ExpressionList ] | "=" ExpressionList ) .
semantics: |
  Declares variables with an explicit type, or infers from initializers when
  Type is omitted (group specs and Go-style). Tamil-0.70 added package-level
  மாறி; Tamil-0.73 adds parenthesized மாறி ( … ) groups at package and block
  scope. No iota / previous-RHS repeat (unlike மாறிலி groups). Package vars
  zero-init; explicit initializers run in __init_vars before entry.
examples:
  - |
      மாறி (
          பதிப்பு முழுஎண் = 1
          எண் முழுஎண்
          பெயர் = "நிரலுளி"
      )
notes:
  - "Short declare := remains local only."
  - "Tamil-0.73: parenthesized var groups."
