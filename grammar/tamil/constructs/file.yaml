id: file
status: codegen
subset: Tamil-0.78
go_inspired: |
  f.Seek(2, io.SeekStart)
  os.Mkdir("d", 0755)
  entries, _ := os.ReadDir("d")
  os.Chmod("f", 0600)
tamil_keywords: {}
tamil_ebnf: |
  # no new syntax — stdlib package கோப்பு (கொணர் "கோப்பு")
semantics: >
  Tamil-0.63 adds POSIX file I/O via stdlib package கோப்பு. Opaque கை
  handles are file descriptors. திற opens for reading; உருவாக்கு creates
  or truncates for writing. படி / எழுது transfer []இருமி8; EOF is
  (0, இன்மை). விடு closes. படிஅனை / எழுதுஅனை cover whole regular files.
  Tamil-0.78 adds தேடு (lseek), அடைவுஉருவாக்கு (mkdir), அடைவுபடி
  (readdir names as []சரம்), and அனுமதிமாற்று (chmod). Failures return
  *கோப்பு.பிழை. Blocking calls park for GC.
examples:
  - tamil: |
      கொணர் "கோப்பு"
      ப := கோப்பு.எழுதுஅனை("demo.txt", []இருமி8("வணக்கம்"))
      தரவு, ப := கோப்பு.படிஅனை("demo.txt")
      பதிப்பி(சரம்(தரவு))
    go_equivalent: |
      _ = os.WriteFile("demo.txt", []byte("வணக்கம்"), 0644)
      data, _ := os.ReadFile("demo.txt")
      println(string(data))
notes:
  - "No new keywords; கோப்பு is a compiler stdlib package."
  - "Linux/POSIX only; no glob in this slice."
  - "Handles require explicit விடு; there are no finalizers."
  - "அடைவுபடி returns names only (no DirEntry metadata)."
