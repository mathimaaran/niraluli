status: codegen
subset: Tamil-0.66
go_analogue: "...T"
syntax: |
  ParameterDecl = identifier [ "..." ] Type .
  # ...T only as the final parameter of a function, method, or function literal.
  # Function types: செயல்பாடு(...T) or செயல்பாடு(U, ...T).
semantics: |
  Tamil-0.66 adds Go-style variadic parameters. Inside the function the name
  has type []T. Calls may pass zero or more trailing arguments of type T; the
  compiler packs them into a []T. slice... expand at call sites is not included.
  Deferred/goroutine calls of variadic callees pack at the original call site
  capture path may be incomplete — prefer ordinary calls for now.
examples:
  - |
      செயல்பாடு கூட்டு(எண்கள் ...முழுஎண்) முழுஎண் {
          மாறி மொத்தம் முழுஎண் = 0
          சுழல் _, வ := ஒவ்வொரு எண்கள் { மொத்தம் = மொத்தம் + வ }
          திருப்பு மொத்தம்
      }
      பதிப்பி(கூட்டு(1, 2, 3))
notes:
  - "No new Tamil keyword; ... is punctuation like Go."
  - "வடிவம்.வடிவமை now uses ...சரம்."
