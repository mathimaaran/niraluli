status: codegen
subset: Tamil-0.69
go_analogue: "...T" / slice...
syntax: |
  ParameterDecl = identifier [ "..." ] Type .
  CallExpr      = Fun "(" [ ArgList [ "..." ] ] ")" .
  # Final call argument may be followed by ... to expand a []T slice into a ...T parameter.
semantics: |
  Tamil-0.66 added Go-style variadic parameters: inside the function the name has
  type []T and trailing T values at call sites are packed into a temporary slice.
  Tamil-0.69 adds slice expansion: when the final argument is a []T followed by ...,
  its elements are passed as the variadic arguments (the callee still receives []T).
  Example: கூட்டு(எண்கள்...) where கூட்டு takes ...முழுஎண் and எண்கள் is []முழுஎண்.
examples:
  - |
      செயல்பாடு கூட்டு(எண்கள் ...முழுஎண்) முழுஎண் { ... }
      மாறி xs []முழுஎண் = []முழுஎண்{4, 5, 6}
      பதிப்பி(கூட்டு(1, 2, 3))   // pack literals
      பதிப்பி(கூட்டு(xs...))     // expand slice
notes:
  - "No new Tamil keyword; ... is punctuation like Go."
  - "Expand applies only to the final argument of a variadic call."
